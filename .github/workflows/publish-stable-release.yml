name: Stable Release veröffentlichen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Version und Release Notes prüfen
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^APP_VERSION = "\([^"]*\)"/\1/p' backend/version.py)"
          test -n "$version"
          tag="v$version"
          grep -Fq "# Quad Parallel Race $tag" RELEASE_NOTES.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Vorhandenen Release prüfen
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stable Release und Tag erstellen
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Quad Parallel Race $TAG" \
            --notes-file RELEASE_NOTES.md \
            --latest

      - name: Vorhandene Release Notes aktualisieren
        if: steps.existing.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release edit "$TAG" \
            --title "Quad Parallel Race $TAG" \
            --notes-file RELEASE_NOTES.md \
            --latest

      - name: Stable Docker-Veröffentlichung starten
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git diff --quiet "$GITHUB_SHA^" "$GITHUB_SHA" -- RELEASE_NOTES.md; then
            echo "Release Notes unverändert; kein neuer Stable-Docker-Build."
            exit 0
          fi
          gh workflow run publish-images.yml --ref "$TAG"
