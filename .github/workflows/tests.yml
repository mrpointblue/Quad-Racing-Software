name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python-Dateien prüfen
        run: python -m compileall -q backend scripts tests

      - name: Automatisierte Tests ausführen
        run: python -m unittest discover -s tests -v

      - name: Docker Compose prüfen
        run: docker compose config --quiet

      - name: Anwendungs-Image bauen
        run: docker build --tag quad-race:test .

      - name: Kiosk-Image bauen
        run: docker build --file docker/kiosk/Dockerfile --tag quad-race-kiosk:test .
