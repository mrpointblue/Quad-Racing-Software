name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python-Dateien prüfen
        run: python -m compileall -q backend scripts tests

      - name: Automatisierte Tests ausführen
        run: python -m unittest discover -s tests -v

      - name: Installationsskripte prüfen
        run: bash -n install_docker.sh install_release.sh install_service.sh

      - name: Docker Compose prüfen
        run: |
          docker compose config --quiet
          docker compose --file compose.release.yaml config --quiet

      - name: Anwendungs-Image bauen
        run: docker build --tag quad-race:test .

      - name: Anwendung im Container prüfen
        run: |
          container_id="$(docker run --detach --publish 8000:8000 quad-race:test)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ui/monitor >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1

      - name: Kiosk-Image bauen
        run: docker build --file docker/kiosk/Dockerfile --tag quad-race-kiosk:test .
